    <rect x="27" y="3" width="8" height="6" rx="1" fill="#1E293B" stroke="#4ADE80" stroke-width="0.8"/>
    <!-- Ojo -->
    <ellipse cx="15" cy="6.5" rx="5" ry="3.5" fill="#E5E5E5"/>
    <circle cx="15" cy="6.5" r="2.2" fill="#22C55E"/>
    <circle cx="15" cy="6.5" r="1" fill="#101010"/>
    <circle cx="15.9" cy="5.6" r="0.45" fill="#FFFFFF"/>

      <rect x="14.44" y="12.5" width="1.8" height="4.5"/>
      <rect x="17.55" y="12.5" width="1.8" height="4.5"/>
      <rect x="20.66" y="12.5" width="1.8" height="4.5"/>
      <rect x="23.77" y="12.5" width="1.8" height="4.5"/>
      <rect x="26.88" y="12.5" width="1.8" height="4.5"/>
      <rect x="29.99" y="12.5" width="1.8" height="4.5"/>
      <rect x="33.1" y="12.5" width="1.8" height="4.5"/>
      <rect x="36.21" y="12.5" width="1.8" height="4.5"/>

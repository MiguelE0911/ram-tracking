    <rect x="0" y="0" width="48" height="14" rx="2" fill="#14532D" stroke="#22C55E" stroke-width="1.5"/>
    <!-- Pistas del circuito -->
    <rect x="3" y="5" width="3" height="6" fill="#2FBF71" opacity="0.35"/>
    <rect x="34" y="5" width="3" height="6" fill="#2FBF71" opacity="0.35"/>
